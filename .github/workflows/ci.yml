name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest --junitxml=pytest-report.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}
          path: pytest-report.xml
          if-no-files-found: ignore

  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Record test execution
        run: agentproof record-command self-audit.jsonl pytest -q
      - name: Audit completion claim
        run: |
          printf 'All tests passed.\n' > final-response.txt
          agentproof audit self-audit.jsonl \
            --response-file final-response.txt \
            --fail-under 100 \
            --json self-audit-report.json \
            --html self-audit-report.html
      - name: Run adversarial benchmark
        run: agentproof benchmark > benchmark-report.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentproof-self-audit
          path: |
            self-audit.jsonl
            self-audit-report.json
            self-audit-report.html
            benchmark-report.json
          if-no-files-found: error
