name: ci-smoke

on:
  push:
    branches:
      - main
      - "agentproof/**"
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentproof-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Syntax and import smoke
        run: |
          python -m compileall -q src
          PYTHONPATH=src python - <<'PY'
          import agentproof
          print("agentproof import: OK")
          PY
