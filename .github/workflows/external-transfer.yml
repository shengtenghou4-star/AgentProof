name: external-transfer-benchmark

# Full external-transfer validation runs on Muse/local compute under the zero-cost policy.
# This file is retained only as a manual historical recipe.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python -m py_compile external_benchmark/run_transfer_benchmark.py
      - name: Run preregistered external transfer benchmark
        run: |
          python external_benchmark/run_transfer_benchmark.py \
            --output external_benchmark/external-transfer-result.json \
            | tee external_benchmark/external-transfer-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentproof-external-transfer-v1
          path: |
            external_benchmark/PREREGISTRATION.md
            external_benchmark/external-transfer-result.json
            external_benchmark/external-transfer-summary.txt
          if-no-files-found: error
